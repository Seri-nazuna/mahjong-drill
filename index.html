<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>麻雀 点数計算ドリル</title>
<style>
  :root {
    --table: #0d3a30;
    --table-deep: #072720;
    --card: #f6f1e4;
    --card-sub: #efe8d6;
    --line: #d8d0bb;
    --ink: #1d1d1b;
    --muted: #6b6658;
    --accent: #c8402f;
    --gold: #c9a24a;
    --ok: #2f7d4f;
    --ng: #b23a2a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(ellipse at top, var(--table) 0%, var(--table-deep) 100%);
    color: #f2efe6;
    font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
    line-height: 1.6;
  }
  main { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.5rem; margin: 0; letter-spacing: .05em; }
  h2 { font-size: 1.05rem; margin: 0; }
  h3 { font-size: .95rem; margin: 16px 0 4px; }
  .sub { color: #bcd3c8; font-size: .9rem; margin: 4px 0 20px; }

  .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 8px; font-size: .9rem; }
  .seg { display: inline-flex; border: 1px solid rgba(255,255,255,.35); border-radius: 999px; overflow: hidden; }
  .seg button { background: transparent; color: #f2efe6; border: 0; padding: 6px 14px; font: inherit; cursor: pointer; }
  .seg button.on { background: var(--gold); color: var(--ink); font-weight: 700; }
  label.chk { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
  .focus-note { min-height: 1.4em; font-size: .85rem; color: #e3cf8f; margin: 0 0 10px; }

  .panel { background: var(--card); color: var(--ink); border-radius: 14px; padding: 18px; margin-bottom: 16px; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
  .q-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .chip { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; font-weight: 700; font-size: 1.15rem; }
  .chip small { font-weight: 400; color: var(--muted); font-size: .75rem; margin-left: 2px; }
  .chip.oya { border-color: var(--accent); color: var(--accent); }
  .prompt { margin: 0 0 12px; }

  .head-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .head-row h1 { font-size: clamp(1.15rem, 5.4vw, 1.5rem); white-space: nowrap; }
  .tabs { display: flex; flex-shrink: 0; background: rgba(0,0,0,.25); border-radius: 999px; padding: 3px; }
  .tabs button { border: 0; background: transparent; color: #cfe0d8; font: inherit; font-size: .78rem; font-weight: 700; padding: 5px 10px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
  .tabs button.on { background: var(--card); color: var(--ink); }
  [hidden] { display: none !important; }

  /* 牌姿 */
  .situ { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .chip.sm { font-size: .8rem; padding: 3px 8px; font-weight: 700; display: inline-flex; align-items: center; gap: 3px; }
  .chip.riichi { border-color: var(--gold); color: #8a6a1f; }
  .hand-row { display: flex; align-items: flex-start; gap: 7px; margin-bottom: 10px; --tw: clamp(19px, 5.3vw, 30px); }
  .tiles { display: flex; gap: 1px; }
  .win, .meld { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .win small, .meld small { font-size: .7rem; color: var(--muted); }
  .melds { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; --tw: clamp(19px, 5.3vw, 30px); }
  .tile {
    width: var(--tw, 22px); height: calc(var(--tw, 22px) * 1.38);
    background: #fff; border: 1px solid #bdb59f; border-radius: 3px; box-shadow: 0 2px 0 #cfc6b0;
    display: inline-flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; line-height: 1.05; color: var(--ink);
  }
  .tile b { font-size: calc(var(--tw, 22px) * .58); font-weight: 700; }
  .tile i { font-style: normal; font-size: calc(var(--tw, 22px) * .48); }
  .tile.suit0 i { color: #c0392b; }
  .tile.suit1 i { color: #1f5fa8; }
  .tile.suit2 i { color: #1d7a45; }
  .tile.honor { font-size: calc(var(--tw, 22px) * .7); font-weight: 700; }
  .tile.chun { color: #c0392b; }
  .tile.hatsu { color: #1d7a45; }
  .tile.haku::after { content: ''; width: 55%; height: 60%; border: 2px solid #7fa3c9; border-radius: 2px; }
  .tile.back { background: #2f7d5c; border-color: #1f5a41; box-shadow: 0 2px 0 #1f5a41; }
  .tile.agari { box-shadow: 0 2px 0 var(--gold), 0 0 0 2px var(--gold); }
  .tile.mini { --tw: 16px; box-shadow: none; }

  .breakdown { margin-top: 10px; background: var(--card-sub); border-radius: 8px; padding: 8px 12px; font-size: .9rem; }
  .breakdown ul { list-style: none; margin: 0; padding: 0; }
  .breakdown li { display: flex; justify-content: space-between; padding: 2px 0; }
  .total-line { margin: 4px 0 0; padding-top: 4px; border-top: 1px dashed var(--line); font-weight: 700; text-align: right; }
  .fu-line { margin: 4px 0 0; font-size: .8rem; color: var(--muted); }
  .rules { font-size: .75rem; color: var(--muted); margin: 12px 0 0; }

  .fields { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .field { display: flex; flex-direction: column; font-size: .8rem; color: var(--muted); flex: 1; min-width: 120px; }
  .field input {
    font-size: 1.4rem; padding: 8px 10px; border: 2px solid var(--line); border-radius: 8px;
    background: #fff; color: var(--ink); font-variant-numeric: tabular-nums; width: 100%;
  }
  .field input:focus { outline: none; border-color: var(--gold); }
  .field input:disabled { background: var(--card-sub); }

  .btn { display: block; width: 100%; border: 0; border-radius: 10px; padding: 12px; font: inherit; font-weight: 700; font-size: 1rem; cursor: pointer; background: var(--table); color: #fff; }
  .btn.small { width: auto; display: inline-block; background: transparent; color: var(--muted); border: 1px solid var(--line); font-weight: 400; font-size: .8rem; padding: 4px 10px; }
  .msg { font-size: .85rem; color: var(--ng); min-height: 1.2em; margin: 6px 0 0; }

  .result { margin-top: 14px; border-top: 1px dashed var(--line); padding-top: 12px; }
  .verdict { font-size: 1.3rem; font-weight: 800; }
  .verdict.ok { color: var(--ok); }
  .verdict.ng { color: var(--ng); }
  .tag { display: inline-block; background: var(--ng); color: #fff; font-size: .78rem; border-radius: 6px; padding: 2px 8px; margin-left: 6px; vertical-align: middle; font-weight: 700; }

  .stats-head { display: flex; justify-content: space-between; align-items: center; }
  .nums { display: flex; gap: 24px; margin-top: 8px; }
  .nums div { font-size: .8rem; color: var(--muted); }
  .nums b { display: block; font-size: 1.5rem; color: var(--ink); font-variant-numeric: tabular-nums; }
  .bar-row { display: grid; grid-template-columns: 8.5em 1fr 2em; gap: 8px; align-items: center; font-size: .85rem; margin: 6px 0; }
  .bar { height: 10px; background: #e3dbc6; border-radius: 5px; overflow: hidden; }
  .bar span { display: block; height: 100%; background: var(--accent); }
  .empty { font-size: .85rem; color: var(--muted); }

  footer { font-size: .8rem; color: #9fbfb1; text-align: center; }
  footer a { color: #d9c48a; }
</style>
</head>
<body>
<main>
  <header>
    <div class="head-row">
      <h1>麻雀 点数計算ドリル</h1>
      <div class="tabs" id="tabs" aria-label="出題の種類">
        <button type="button" data-tab="hanfu">翻・符</button>
        <button type="button" data-tab="hand">牌姿</button>
      </div>
    </div>
    <p class="sub">答えを出すだけでなく、どこで間違えたかを記録して、自分の苦手を見つけます。</p>
  </header>

  <div class="controls">
    <div class="seg" id="modeSeg">
      <button type="button" data-mode="random">ランダム</button>
      <button type="button" data-mode="weak">苦手を優先</button>
    </div>
    <label class="chk"><input type="checkbox" id="kiriage"> 切り上げ満貫あり</label>
  </div>
  <p class="focus-note" id="focusNote"></p>

  <section class="panel">
    <div id="chips"></div>
    <p class="prompt" id="prompt"></p>
    <form id="form" autocomplete="off">
      <div class="fields" id="fields"></div>
      <button class="btn" id="mainBtn" type="submit">答え合わせ</button>
      <p class="msg" id="msg"></p>
    </form>
    <div class="result" id="result" hidden></div>
    <p class="rules" id="handRules" hidden>赤ドラ・裏ドラ・一発・海底などの偶然役はありません。役満の手は出題しません。</p>
  </section>

  <section class="panel">
    <div class="stats-head">
      <h2 id="statsTitle">成績</h2>
      <button class="btn small" type="button" id="reset">リセット</button>
    </div>
    <div class="nums">
      <div>正解率<b id="rate">-</b></div>
      <div>連続正解<b id="streak">0</b></div>
      <div>最高記録<b id="best">0</b></div>
    </div>
    <h3>つまずきの内訳<small style="font-weight:400;color:var(--muted);margin-left:6px" id="recentNote"></small></h3>
    <div id="bars"></div>
  </section>

  <footer>
    13翻以上は数え役満として扱います。本場・供託は考えません。<br>
    符と翻から点数を出す電卓版はこちら：<a href="https://seri-nazuna.github.io/mahjong-score/">麻雀 点数計算機</a>
  </footer>
</main>

<script>
/* ===== 点数計算のロジック（画面に依存しない部分） ===== */

const HAN_WEIGHTS = [[1,15],[2,20],[3,20],[4,20],[5,7],[6,4],[7,2],[8,2],[9,1],[10,1],[11,2],[12,1],[13,2]];
const FU_WEIGHTS  = [[20,6],[25,6],[30,20],[40,20],[50,12],[60,8],[70,6],[80,5],[90,4],[100,3],[110,3]];

const CATEGORIES = {
  kiriage: { label: '100点の切り上げ' },
  mangan:  { label: '満貫・上限の判定' },
  oyako:   { label: '親と子の取り違え' },
  tsumo:   { label: 'ツモの支払い' },
  han:     { label: '翻による倍々' },
  other:   { label: 'その他' },
};

function pickWeighted(list) {
  const total = list.reduce((s, [, w]) => s + w, 0);
  let r = Math.random() * total;
  for (const [v, w] of list) { if ((r -= w) < 0) return v; }
  return list[list.length - 1][0];
}

const ceil100  = x => Math.ceil(x / 100) * 100;
const floor100 = x => Math.floor(x / 100) * 100;
const noRound  = x => x;

function limitOf(han) {
  if (han >= 13) return { base: 8000, name: '役満（数え役満）' };
  if (han >= 11) return { base: 6000, name: '三倍満' };
  if (han >= 8)  return { base: 4000, name: '倍満' };
  if (han >= 6)  return { base: 3000, name: '跳満' };
  if (han === 5) return { base: 2000, name: '満貫' };
  return null;
}

// 基礎点を求める。raw は満貫で頭打ちする前の値（5翻以上は null）
function baseInfo(han, fu, rule) {
  const lim = limitOf(han);
  if (lim) return { base: lim.base, raw: null, name: lim.name };
  const raw = fu * 2 ** (2 + han);
  if (raw > 2000) return { base: 2000, raw, name: '満貫' };
  if (rule.kiriage && raw >= 1920) return { base: 2000, raw, name: '満貫（切り上げ満貫）' };
  return { base: raw, raw, name: null };
}

// 支払い額の配列。ロン:[点数] 親ツモ:[子1人あたり] 子ツモ:[子の支払い, 親の支払い]
function payments(base, dealer, tsumo, round = ceil100) {
  if (!tsumo) return [round(base * (dealer ? 6 : 4))];
  if (dealer) return [round(base * 2)];
  return [round(base), round(base * 2)];
}

function answerOf(q, rule) {
  return payments(baseInfo(q.han, q.fu, rule).base, q.dealer, q.tsumo);
}

// 実際にありえない組み合わせを除く
function isValid(han, fu, tsumo) {
  if (fu === 20 && (!tsumo || han < 2)) return false;               // 20符は平和ツモのみ
  if (fu === 25 && (han < 2 || (tsumo && han < 3))) return false;   // 25符は七対子
  if (han === 1 && fu < 30) return false;
  return true;
}

// focus: 優先したい苦手のカテゴリ（なければ null）
function generateQuestion(focus, rule, prev) {
  for (let i = 0; i < 1000; i++) {
    const han = pickWeighted(HAN_WEIGHTS);
    const fu = pickWeighted(FU_WEIGHTS);
    let dealer = Math.random() < 0.35;
    let tsumo = Math.random() < 0.45;
    if (focus === 'oyako') dealer = Math.random() < 0.5;
    if (focus === 'tsumo') tsumo = true;
    if (!isValid(han, fu, tsumo)) continue;

    const bi = baseInfo(han, fu, rule);
    if (focus === 'kiriage') {
      if (bi.raw === null || bi.base !== bi.raw) continue;
      if (payments(bi.base, dealer, tsumo, noRound).every(v => v % 100 === 0)) continue;
    }
    if (focus === 'mangan' && !(han >= 3 && (han >= 5 || fu * 2 ** (2 + han) >= 1500))) continue;
    if (focus === 'han' && !(han <= 4 && bi.raw !== null && bi.base === bi.raw)) continue;

    const q = { han, fu, dealer, tsumo };
    if (prev && prev.han === han && prev.fu === fu && prev.dealer === dealer && prev.tsumo === tsumo) continue;
    return q;
  }
  return { han: 3, fu: 30, dealer: false, tsumo: false };
}

const sameArr = (a, b) => a.length === b.length && a.every((v, i) => v === b[i]);

// 間違いの型を推定する。よくある誤りを再現した計算と一致するかで判定
function classify(q, user, rule) {
  const correct = answerOf(q, rule);
  if (sameArr(user, correct)) return null;
  const { han, fu, dealer, tsumo } = q;
  const bi = baseInfo(han, fu, rule);
  const models = [];

  // 切り上げ忘れ（そのまま／切り捨て）
  models.push(['kiriage', payments(bi.base, dealer, tsumo, noRound)]);
  models.push(['kiriage', payments(bi.base, dealer, tsumo, floor100)]);

  // 満貫・上限の判定ミス
  const uncapped = fu * 2 ** (2 + han);
  models.push(['mangan', payments(uncapped, dealer, tsumo)]);
  models.push(['mangan', payments(uncapped, dealer, tsumo, noRound)]);
  models.push(['mangan', payments(baseInfo(han, fu, { kiriage: !rule.kiriage }).base, dealer, tsumo)]);
  if (han >= 5) {
    for (const h of [han - 1, han + 1]) {
      if (h <= 13) models.push(['mangan', payments(baseInfo(h, fu, rule).base, dealer, tsumo)]);
    }
  }

  // 親子の取り違え
  models.push(['oyako', payments(bi.base, !dealer, tsumo)]);
  models.push(['oyako', payments(bi.base, !dealer, tsumo, noRound)]);

  // ツモの支払いミス
  if (tsumo && !dealer) {
    models.push(['tsumo', [correct[1], correct[0]]]);
  }
  if (tsumo && dealer) {
    models.push(['tsumo', [ceil100(bi.base * 6)]]);  // ロンの点数を書いた
    models.push(['tsumo', [ceil100(bi.base)]]);      // 子の支払い額を書いた
    models.push(['tsumo', [correct[0] * 3]]);        // 合計を書いた
  }

  // 翻の数え違い（倍々）
  if (han <= 4) {
    for (const h of [han - 1, han + 1]) {
      if (h >= 1) models.push(['han', payments(baseInfo(h, fu, rule).base, dealer, tsumo)]);
    }
  }

  for (const [cat, ans] of models) {
    if (!sameArr(ans, correct) && sameArr(ans, user)) return cat;
  }
  return 'other';
}

/* ===== 牌姿から点数を求める（役・符の判定） ===== */
// 牌の番号：0〜8 萬子、9〜17 筒子、18〜26 索子、27東 28南 29西 30北 31白 32發 33中
const EAST = 27, SOUTH = 28, WHITE = 31;
const WIND_NAMES = ['東', '南', '西', '北'];
const HONOR_NAMES = ['東', '南', '西', '北', '白', '發', '中'];
const isHonor = (t) => t >= 27;
const isDragon = (t) => t >= 31;
const numOf = (t) => (t % 9) + 1;
const suitOf = (t) => Math.floor(t / 9);  // 3 は字牌
const isTerminal = (t) => !isHonor(t) && (numOf(t) === 1 || numOf(t) === 9);
const isYaochu = (t) => isHonor(t) || isTerminal(t);
const SUIT_NAMES = ['萬', '筒', '索'];
const KANJI_NUM = ['一', '二', '三', '四', '五', '六', '七', '八', '九'];
function tileName(t) {
  return isHonor(t) ? HONOR_NAMES[t - 27] : KANJI_NUM[numOf(t) - 1] + SUIT_NAMES[suitOf(t)];
}

// ドラ表示牌から実際のドラを求める
function doraFrom(ind) {
  if (ind < 27) return suitOf(ind) * 9 + (numOf(ind) % 9);
  if (ind <= 30) return 27 + ((ind - 27 + 1) % 4);
  return 31 + ((ind - 31 + 1) % 3);
}

// 手牌（枚数の配列）を「雀頭1つ＋面子」に分ける方法をすべて挙げる
function decompose(counts, setsNeeded) {
  const results = [];
  const c = counts.slice();
  function extract(sets) {
    let t = c.findIndex((n) => n > 0);
    if (t === -1) { if (sets.length === setsNeeded) results.push(sets.slice()); return; }
    if (c[t] >= 3) {
      c[t] -= 3; sets.push({ kind: 'trip', t }); extract(sets); sets.pop(); c[t] += 3;
    }
    if (!isHonor(t) && numOf(t) <= 7 && c[t + 1] > 0 && c[t + 2] > 0) {
      c[t]--; c[t + 1]--; c[t + 2]--;
      sets.push({ kind: 'seq', t }); extract(sets); sets.pop();
      c[t]++; c[t + 1]++; c[t + 2]++;
    }
  }
  for (let p = 0; p < 34; p++) {
    if (c[p] < 2) continue;
    c[p] -= 2;
    const before = results.length;
    extract([]);
    for (let i = before; i < results.length; i++) results[i] = { pair: p, sets: results[i] };
    c[p] += 2;
  }
  return results;
}

const countsOf = (tiles) => { const c = new Array(34).fill(0); tiles.forEach((t) => c[t]++); return c; };
const setTiles = (s) => s.kind === 'seq' ? [s.t, s.t + 1, s.t + 2] : new Array(s.kind === 'kan' ? 4 : 3).fill(s.t);

// 鳴き・暗槓を面子の形に直す
function meldToSet(m) {
  if (m.type === 'chi') return { kind: 'seq', t: m.t, open: true, called: true };
  if (m.type === 'pon') return { kind: 'trip', t: m.t, open: true, called: true };
  if (m.type === 'minkan') return { kind: 'kan', t: m.t, open: true, called: true };
  return { kind: 'kan', t: m.t, open: false, called: true };  // 暗槓
}

function allTilesOf(hand) {
  return hand.closed.concat(...hand.melds.map((m) => setTiles(meldToSet(m))));
}

function countDora(hand) {
  const tiles = allTilesOf(hand);
  let n = 0;
  for (const ind of hand.doraInd) { const d = doraFrom(ind); n += tiles.filter((t) => t === d).length; }
  return n;
}

// 1つの解釈（面子の分け方と待ちの形）について、役と符を数える
function scoreStandard(hand, pair, sets, waitKind) {
  const menzen = hand.melds.every((m) => m.type === 'ankan');
  const yaku = [];
  const add = (name, han) => yaku.push({ name, han });
  const kui = (closedHan) => (menzen ? closedHan : closedHan - 1);

  const isValuePair = (t) => isDragon(t) || t === hand.seat || t === hand.round;
  const seqs = sets.filter((s) => s.kind === 'seq');
  const trips = sets.filter((s) => s.kind !== 'seq');  // 刻子と槓子
  const tiles = [pair, pair].concat(...sets.map(setTiles));

  if (hand.riichi) add('リーチ', 1);
  if (menzen && hand.tsumo) add('門前清自摸和', 1);
  if (tiles.every((t) => !isYaochu(t))) add('断么九', 1);
  const pinfu = menzen && seqs.length === 4 && !isValuePair(pair) && waitKind === 'ryanmen';
  if (pinfu) add('平和', 1);

  if (menzen) {
    const keys = {};
    seqs.forEach((s) => { keys[s.t] = (keys[s.t] || 0) + 1; });
    const peko = Object.values(keys).reduce((a, n) => a + Math.floor(n / 2), 0);
    if (peko === 2) add('二盃口', 3);
    else if (peko === 1) add('一盃口', 1);
  }

  for (const s of trips) {
    if (isDragon(s.t)) add('役牌 ' + HONOR_NAMES[s.t - 27], 1);
    if (s.t === hand.seat) add('自風 ' + HONOR_NAMES[s.t - 27], 1);
    if (s.t === hand.round) add('場風 ' + HONOR_NAMES[s.t - 27], 1);
  }

  for (let n = 0; n < 7; n++) {
    if ([0, 1, 2].every((su) => seqs.some((s) => s.t === su * 9 + n))) { add('三色同順', kui(2)); break; }
  }
  for (let su = 0; su < 3; su++) {
    if ([0, 3, 6].every((n) => seqs.some((s) => s.t === su * 9 + n))) { add('一気通貫', kui(2)); break; }
  }
  if (trips.length === 4) add('対々和', 2);
  const concealedTrips = trips.filter((s) => !s.open).length;
  if (concealedTrips === 3) add('三暗刻', 2);
  if (trips.filter((s) => s.kind === 'kan').length === 3) add('三槓子', 2);
  for (let n = 0; n < 9; n++) {
    if ([0, 1, 2].every((su) => trips.some((s) => s.t === su * 9 + n))) { add('三色同刻', 2); break; }
  }
  if (trips.filter((s) => isDragon(s.t)).length === 2 && isDragon(pair)) add('小三元', 2);

  const allYaochu = tiles.every(isYaochu);
  if (allYaochu) add('混老頭', 2);
  const setHasYaochu = (s) => s.kind === 'seq' ? (numOf(s.t) === 1 || numOf(s.t) === 7) : isYaochu(s.t);
  if (!allYaochu && seqs.length > 0 && isYaochu(pair) && sets.every(setHasYaochu)) {
    if (tiles.some(isHonor)) add('混全帯么九', kui(2));
    else add('純全帯么九', kui(3));
  }

  const suits = new Set(tiles.filter((t) => !isHonor(t)).map(suitOf));
  if (suits.size === 1) {
    if (tiles.some(isHonor)) add('混一色', kui(3));
    else add('清一色', kui(6));
  }

  // 符
  const fuItems = [];
  let fu;
  if (pinfu && hand.tsumo) {
    fu = 20; fuItems.push(['平和ツモ', 20]);
  } else {
    fuItems.push(['副底', 20]);
    if (menzen && !hand.tsumo) fuItems.push(['門前ロン', 10]);
    if (hand.tsumo) fuItems.push(['ツモ', 2]);
    for (const s of trips) {
      let f = 2;
      if (isYaochu(s.t)) f *= 2;
      if (!s.open) f *= 2;
      if (s.kind === 'kan') f *= 4;
      const label = (s.kind === 'kan' ? (s.open ? '明槓' : '暗槓') : (s.open ? '明刻' : '暗刻'));
      fuItems.push([tileName(s.t) + 'の' + label, f]);
    }
    let pf = 0;
    if (isDragon(pair)) pf += 2;
    if (pair === hand.seat) pf += 2;
    if (pair === hand.round) pf += 2;
    if (pf) fuItems.push([tileName(pair) + 'の雀頭', pf]);
    const waitNames = { kanchan: 'カンチャン待ち', penchan: 'ペンチャン待ち', tanki: '単騎待ち' };
    if (waitNames[waitKind]) fuItems.push([waitNames[waitKind], 2]);
    const raw = fuItems.reduce((a, [, f]) => a + f, 0);
    fu = Math.ceil(raw / 10) * 10;
    if (!menzen && fu === 20) { fu = 30; fuItems.push(['鳴いた平和形のロンは30符', 10]); }
  }
  return { yaku, fu, fuItems, suuankou: concealedTrips === 4 };
}

function scoreChiitoi(hand) {
  const yaku = [];
  const add = (name, han) => yaku.push({ name, han });
  const tiles = hand.closed;
  if (hand.riichi) add('リーチ', 1);
  if (hand.tsumo) add('門前清自摸和', 1);
  add('七対子', 2);
  if (tiles.every((t) => !isYaochu(t))) add('断么九', 1);
  if (tiles.every(isYaochu)) add('混老頭', 2);
  const suits = new Set(tiles.filter((t) => !isHonor(t)).map(suitOf));
  if (suits.size === 1) {
    if (tiles.some(isHonor)) add('混一色', 3);
    else add('清一色', 6);
  }
  return { yaku, fu: 25, fuItems: [['七対子', 25]] };
}

// 手牌を評価し、一番点数が高くなる解釈を返す（役がなければ null）
function evaluateHand(hand, rule) {
  const counts = countsOf(hand.closed);
  const candidates = [];

  if (hand.melds.length === 0 && counts.filter((n) => n === 2).length === 7) {
    candidates.push(scoreChiitoi(hand));
  }

  const meldSets = hand.melds.map(meldToSet);
  for (const d of decompose(counts, 4 - hand.melds.length)) {
    const groups = [{ kind: 'pair', t: d.pair }].concat(d.sets);
    groups.forEach((g, i) => {
      let waitKind;
      if (g.kind === 'pair') { if (g.t !== hand.win) return; waitKind = 'tanki'; }
      else if (g.kind === 'trip') { if (g.t !== hand.win) return; waitKind = 'shanpon'; }
      else {
        const pos = hand.win - g.t;
        if (pos < 0 || pos > 2) return;
        if (pos === 1) waitKind = 'kanchan';
        else if ((pos === 2 && numOf(g.t) === 1) || (pos === 0 && numOf(g.t) === 7)) waitKind = 'penchan';
        else waitKind = 'ryanmen';
      }
      // ロンで完成した刻子は明刻として扱う
      const closedSets = d.sets.map((s, j) => ({ ...s, open: waitKind === 'shanpon' && !hand.tsumo && j === i - 1 }));
      candidates.push(scoreStandard(hand, d.pair, closedSets.concat(meldSets), waitKind));
    });
  }

  if (candidates.some((c) => c.suuankou)) return null;  // 四暗刻（役満）は出題しない
  const dora = countDora(hand);
  let best = null;
  for (const c of candidates) {
    const yakuHan = c.yaku.reduce((a, y) => a + y.han, 0);
    if (yakuHan === 0) continue;
    const yaku = dora ? c.yaku.concat([{ name: 'ドラ' + dora, han: dora }]) : c.yaku;
    const han = yakuHan + dora;
    const base = baseInfo(han, c.fu, rule).base;
    const r = { yaku, han, fu: c.fu, fuItems: c.fuItems, base };
    if (!best || base > best.base || (base === best.base && (han > best.han || (han === best.han && c.fu > best.fu)))) best = r;
  }
  return best;
}

/* ----- 出題する手を作る ----- */
const rint = (n) => Math.floor(Math.random() * n);
const pick = (arr) => arr[rint(arr.length)];
const SIMPLE_SEQ_STARTS = [];   // 2〜6 から始まる順子（断么九用）
const ALL_SEQ_STARTS = [];
for (let su = 0; su < 3; su++) for (let n = 0; n < 7; n++) {
  ALL_SEQ_STARTS.push(su * 9 + n);
  if (n >= 1 && n <= 5) SIMPLE_SEQ_STARTS.push(su * 9 + n);
}
const ALL_TILES = Array.from({ length: 34 }, (_, i) => i);
const SIMPLES = ALL_TILES.filter((t) => !isYaochu(t));
const YAOCHU = ALL_TILES.filter(isYaochu);

const THEMES = [
  ['free', 14], ['tanyao', 14], ['pinfu', 12], ['yakuhai', 14], ['honitsu', 8], ['chinitsu', 4],
  ['toitoi', 6], ['sanshoku', 5], ['ittsu', 5], ['chanta', 5], ['iipeikou', 6], ['chiitoi', 7]
];

function buildSets(theme, seat, round) {
  const seq = (starts) => ({ kind: 'seq', t: pick(starts) });
  const trip = (tiles) => ({ kind: 'trip', t: pick(tiles) });
  const any = (seqStarts, tripTiles, seqRate = 0.7) => (Math.random() < seqRate ? seq(seqStarts) : trip(tripTiles));
  const sets = [];
  let pair;
  switch (theme) {
    case 'tanyao':
      for (let i = 0; i < 4; i++) sets.push(any(SIMPLE_SEQ_STARTS, SIMPLES));
      pair = pick(SIMPLES); break;
    case 'pinfu':
      for (let i = 0; i < 4; i++) sets.push(seq(ALL_SEQ_STARTS));
      pair = pick(ALL_TILES.filter((t) => !isDragon(t) && t !== seat && t !== round)); break;
    case 'yakuhai': {
      const values = [31, 32, 33, seat, round];
      sets.push(trip(values));
      for (let i = 0; i < 3; i++) sets.push(any(ALL_SEQ_STARTS, ALL_TILES));
      pair = pick(ALL_TILES); break;
    }
    case 'honitsu': case 'chinitsu': {
      const su = rint(3);
      const starts = ALL_SEQ_STARTS.filter((t) => suitOf(t) === su);
      const own = ALL_TILES.filter((t) => suitOf(t) === su);
      const pool = theme === 'honitsu' ? own.concat([27, 28, 29, 30, 31, 32, 33]) : own;
      for (let i = 0; i < 4; i++) sets.push(any(starts, pool, theme === 'honitsu' ? 0.6 : 0.75));
      pair = pick(pool);
      if (theme === 'honitsu' && ![pair].concat(sets.filter((s) => s.kind === 'trip').map((s) => s.t)).some(isHonor)) {
        sets[0] = trip([27, 28, 29, 30, 31, 32, 33]);
      }
      break;
    }
    case 'toitoi':
      for (let i = 0; i < 4; i++) sets.push(trip(ALL_TILES));
      pair = pick(ALL_TILES); break;
    case 'sanshoku': {
      const n = rint(7);
      for (let su = 0; su < 3; su++) sets.push({ kind: 'seq', t: su * 9 + n });
      sets.push(any(ALL_SEQ_STARTS, ALL_TILES)); pair = pick(ALL_TILES); break;
    }
    case 'ittsu': {
      const su = rint(3);
      for (const n of [0, 3, 6]) sets.push({ kind: 'seq', t: su * 9 + n });
      sets.push(any(ALL_SEQ_STARTS, ALL_TILES)); pair = pick(ALL_TILES); break;
    }
    case 'chanta': {
      const starts = ALL_SEQ_STARTS.filter((t) => numOf(t) === 1 || numOf(t) === 7);
      sets.push(seq(starts));
      for (let i = 0; i < 3; i++) sets.push(any(starts, YAOCHU, 0.6));
      pair = pick(YAOCHU); break;
    }
    case 'iipeikou': {
      const s = seq(ALL_SEQ_STARTS);
      sets.push(s, { ...s });
      for (let i = 0; i < 2; i++) sets.push(any(ALL_SEQ_STARTS, ALL_TILES, 0.8));
      pair = pick(ALL_TILES); break;
    }
    default:
      for (let i = 0; i < 4; i++) sets.push(any(ALL_SEQ_STARTS, ALL_TILES));
      pair = pick(ALL_TILES);
  }
  return { sets, pair };
}

// 役満になってしまう手や、ルールで扱いが分かれる手を除く
function isExcluded(hand, sets, pair) {
  const tiles = allTilesOf(hand);
  const c = countsOf(tiles.concat(hand.doraInd));
  if (c.some((n) => n > 4)) return true;
  const trips = sets.filter((s) => s.kind !== 'seq');
  if (trips.filter((s) => isDragon(s.t)).length === 3) return true;                   // 大三元
  if (trips.filter((s) => s.t >= 27 && s.t <= 30).length >= 3) return true;           // 四喜和
  if (tiles.every(isHonor)) return true;                                              // 字一色
  if (tiles.every(isTerminal)) return true;                                           // 清老頭
  if (tiles.every((t) => [19, 20, 21, 23, 25, 32].includes(t))) return true;          // 緑一色
  if (trips.length === 4 && trips.filter((s) => !s.called).length + hand.melds.filter((m) => m.type === 'ankan').length >= 4) return true;  // 四暗刻の可能性
  if (hand.melds.filter((m) => m.type !== 'chi' && m.type !== 'pon').length >= 4) return true;  // 四槓子
  if (hand.melds.length === 0 && new Set(tiles.map(suitOf)).size === 1 && !tiles.some(isHonor)) {
    const cc = countsOf(tiles).slice(suitOf(tiles[0]) * 9, suitOf(tiles[0]) * 9 + 9);
    if (cc[0] >= 3 && cc[8] >= 3 && cc.every((n) => n >= 1)) return true;              // 九蓮宝燈
  }
  if (pair === hand.seat && pair === hand.round) return true;                         // 連風牌の雀頭（2符か4符かルールで分かれる）
  return false;
}

function generateHand(rule) {
  for (let tries = 0; tries < 5000; tries++) {
    const seat = EAST + rint(4);
    const round = Math.random() < 0.7 ? EAST : SOUTH;
    const theme = pickWeighted(THEMES);
    const tsumo = Math.random() < 0.45;
    let hand;

    if (theme === 'chiitoi') {
      const pool = pick([ALL_TILES, SIMPLES, ALL_TILES.filter((t) => suitOf(t) === 0 || isHonor(t))]);
      const pairs = new Set();
      while (pairs.size < 7) pairs.add(pick(pool));
      const closed = [...pairs].flatMap((t) => [t, t]);
      hand = { closed, melds: [], win: pick([...pairs]), tsumo, riichi: Math.random() < 0.55, seat, round, doraInd: [] };
      hand.doraInd = [rint(34)];
      if (isExcluded(hand, [], -1)) continue;
    } else {
      const { sets, pair } = buildSets(theme, seat, round);
      const canOpen = !['pinfu', 'iipeikou'].includes(theme);
      const openRate = { yakuhai: 0.6, toitoi: 0.6, honitsu: 0.5 }[theme] ?? 0.35;
      let openCount = canOpen && Math.random() < openRate ? 1 + rint(3) : 0;
      const order = sets.map((_, i) => i).sort(() => Math.random() - 0.5);
      const melds = [];
      const closedSets = [];
      order.forEach((i) => {
        const s = sets[i];
        if (openCount > 0) {
          openCount--;
          if (s.kind === 'seq') melds.push({ type: 'chi', t: s.t });
          else melds.push({ type: Math.random() < 0.15 ? 'minkan' : 'pon', t: s.t });
        } else if (s.kind === 'trip' && Math.random() < 0.08) {
          melds.push({ type: 'ankan', t: s.t });
        } else {
          closedSets.push(s);
        }
      });
      if (closedSets.length === 0 && Math.random() < 0.7) continue;  // 裸単騎はたまにだけ
      const closed = [pair, pair].concat(...closedSets.map(setTiles));
      const kans = melds.filter((m) => m.type === 'minkan' || m.type === 'ankan').length;
      hand = { closed, melds, win: pick(closed), tsumo, riichi: false, seat, round, doraInd: [] };
      hand.riichi = melds.every((m) => m.type === 'ankan') && Math.random() < 0.55;
      for (let k = 0; k <= kans; k++) hand.doraInd.push(rint(34));
      // 鳴いた刻子・槓子は「called」として記録しておく（四暗刻の判定に使う）
      const called = sets.map((s) => ({ ...s }));
      melds.forEach((m) => { const s = called.find((x) => !x.called && x.t === m.t && (m.type === 'chi') === (x.kind === 'seq')); if (s) s.called = true; });
      if (isExcluded(hand, called, pair)) continue;
    }

    let res = evaluateHand(hand, rule);
    if (!res && hand.melds.every((m) => m.type === 'ankan') && !hand.riichi) {
      hand.riichi = true;
      res = evaluateHand(hand, rule);
    }
    if (!res) continue;
    return { kind: 'hand', hand, dealer: hand.seat === EAST, tsumo: hand.tsumo };
  }
  return null;
}

const HAND_CATEGORIES = {
  yaku:  { label: '役・翻の数え違い' },
  fu:    { label: '符の数え違い' },
  calc:  { label: '点数の計算' },
  other: { label: 'その他' },
};

// 牌姿モードの間違いの型：翻だけ違う／符だけ違う／翻符は合っていて点数の出し方が違う
function classifyHand(q, user, rule) {
  const res = evaluateHand(q.hand, rule);
  const pts = (h, f) => payments(baseInfo(h, f, rule).base, q.dealer, q.tsumo);
  if (sameArr(pts(res.han, res.fu), user)) return null;
  for (let h = 1; h <= 13; h++) if (h !== res.han && sameArr(pts(h, res.fu), user)) return 'yaku';
  for (const [f] of FU_WEIGHTS) if (f !== res.fu && sameArr(pts(res.han, f), user)) return 'fu';
  const c = classify({ han: res.han, fu: res.fu, dealer: q.dealer, tsumo: q.tsumo }, user, rule);
  if (c && c !== 'other' && c !== 'han') return 'calc';
  return 'other';
}


/* ===== 画面の処理 ===== */
if (typeof document !== 'undefined') {
  const STORE_KEY = 'mahjong-drill.v1';
  const freshStats = () => ({ total: 0, correct: 0, streak: 0, best: 0, recent: [] });
  const fresh = () => Object.assign(freshStats(), { mode: 'random', kiriage: false, tab: 'hanfu', hand: freshStats() });
  let state = fresh();
  try {
    const saved = JSON.parse(localStorage.getItem(STORE_KEY));
    if (saved) state = Object.assign(fresh(), saved);
    delete state.cats;  // 旧版の累計記録は使わない
    if (!Array.isArray(state.recent)) state.recent = [];
    state.hand = Object.assign(freshStats(), state.hand);
  } catch (e) { /* 保存できない環境でも動くようにする */ }
  const save = () => { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {} };

  const $ = id => document.getElementById(id);
  let current = null;
  let answered = false;
  // モードごとに、まだ答えていない問題を覚えておく（モードを戻したときに同じ問題を出すため）
  const pending = { random: null, weak: null, hand: null };

  const rule = () => ({ kiriage: state.kiriage });
  const isHandTab = () => state.tab === 'hand';
  const stats = () => (isHandTab() ? state.hand : state);  // 翻・符モードの成績は従来どおり state 直下
  const categories = () => (isHandTab() ? HAND_CATEGORIES : CATEGORIES);
  const pendingKey = () => (isHandTab() ? 'hand' : state.mode);

  // 直近の答え合わせ結果（null は正解、文字列は間違いの分類）。苦手の判定はこの範囲だけで行う
  const RECENT_LIMIT = 50;

  function catCounts(s = stats()) {
    const counts = {};
    for (const c of s.recent) if (c) counts[c] = (counts[c] || 0) + 1;
    return counts;
  }

  function weakest() {
    const entries = Object.entries(catCounts(state)).filter(([k, v]) => k !== 'other' && v > 0);
    if (!entries.length) return null;
    entries.sort((a, b) => b[1] - a[1]);
    return entries[0][0];
  }

  function renderControls() {
    document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === state.tab));
    document.querySelectorAll('#modeSeg button').forEach(b => b.classList.toggle('on', b.dataset.mode === state.mode));
    $('modeSeg').hidden = isHandTab();
    $('handRules').hidden = !isHandTab();
    $('kiriage').checked = state.kiriage;
    let note = '';
    if (!isHandTab() && state.mode === 'weak') {
      const w = weakest();
      note = w ? `いま優先している苦手：${CATEGORIES[w].label}` : 'まだ苦手の記録がないので、ランダムに出題します。';
    }
    $('focusNote').textContent = note;
  }

  function fieldsFor(q) {
    if (!q.tsumo) return ['点数'];
    if (q.dealer) return ['子1人あたり（オール）'];
    return ['子の支払い', '親の支払い'];
  }

  function newQuestion() {
    if (isHandTab()) { showQuestion(generateHand(rule())); return; }
    const focus = state.mode === 'weak' ? weakest() : null;
    showQuestion(generateQuestion(focus, rule(), current && current.kind === 'hand' ? null : current));
  }

  /* ----- 牌の表示 ----- */
  function tileHtml(t, extra = '') {
    if (t === 'back') return `<span class="tile back ${extra}"></span>`;
    if (isHonor(t)) {
      const cls = t === WHITE ? 'haku' : t === 32 ? 'hatsu' : t === 33 ? 'chun' : 'kaze';
      return `<span class="tile honor ${cls} ${extra}">${t === WHITE ? '' : HONOR_NAMES[t - 27]}</span>`;
    }
    return `<span class="tile suit${suitOf(t)} ${extra}"><b>${KANJI_NUM[numOf(t) - 1]}</b><i>${SUIT_NAMES[suitOf(t)]}</i></span>`;
  }

  const MELD_LABELS = { chi: 'チー', pon: 'ポン', minkan: '明槓', ankan: '暗槓' };
  function meldHtml(m) {
    let tiles;
    if (m.type === 'chi') tiles = [m.t, m.t + 1, m.t + 2];
    else if (m.type === 'pon') tiles = [m.t, m.t, m.t];
    else if (m.type === 'minkan') tiles = [m.t, m.t, m.t, m.t];
    else tiles = ['back', m.t, m.t, 'back'];
    return `<div class="meld"><div class="tiles">${tiles.map(t => tileHtml(t)).join('')}</div><small>${MELD_LABELS[m.type]}</small></div>`;
  }

  function handHtml(q) {
    const h = q.hand;
    const rest = h.closed.slice();
    rest.splice(rest.indexOf(h.win), 1);
    rest.sort((a, b) => a - b);
    const seatName = WIND_NAMES[h.seat - EAST];
    const situ = [
      `<span class="chip sm">${WIND_NAMES[h.round - EAST]}場</span>`,
      `<span class="chip sm ${q.dealer ? 'oya' : ''}">自風 ${seatName}（${q.dealer ? '親' : '子'}）</span>`,
      h.riichi ? '<span class="chip sm riichi">リーチ</span>' : '',
      `<span class="chip sm dora">ドラ表示牌 ${h.doraInd.map(t => tileHtml(t, 'mini')).join('')}</span>`
    ].join('');
    return `<div class="situ">${situ}</div>
      <div class="hand-row">
        <div class="tiles">${rest.map(t => tileHtml(t)).join('')}</div>
        <div class="win"><div class="tiles">${tileHtml(h.win, 'agari')}</div><small>${h.tsumo ? 'ツモ' : 'ロン'}</small></div>
      </div>
      ${h.melds.length ? `<div class="melds">${h.melds.map(meldHtml).join('')}</div>` : ''}`;
  }

  function showQuestion(q) {
    current = q;
    answered = false;
    const who = current.dealer ? '親' : '子';
    if (q.kind === 'hand') {
      $('chips').innerHTML = handHtml(q);
    } else {
      $('chips').innerHTML =
        `<div class="q-chips"><span class="chip">${current.han}<small>翻</small></span>` +
        `<span class="chip">${current.fu}<small>符</small></span>` +
        `<span class="chip ${current.dealer ? 'oya' : ''}">${who}</span>` +
        `<span class="chip">${current.tsumo ? 'ツモ' : 'ロン'}</span></div>`;
    }
    $('prompt').textContent = !current.tsumo
      ? `${who}がロン和了。何点？`
      : current.dealer
        ? '親がツモ和了。子は1人何点払う？'
        : '子がツモ和了。子と親はそれぞれ何点払う？';
    $('fields').innerHTML = fieldsFor(current).map((label, i) =>
      `<label class="field">${label}<input type="text" inputmode="numeric" data-i="${i}"></label>`).join('');
    $('result').hidden = true;
    $('msg').textContent = '';
    $('mainBtn').textContent = '答え合わせ';
    renderControls();
    const first = document.querySelector('#fields input');
    if (first && window.matchMedia('(hover: hover)').matches) first.focus();
  }

  function handBreakdown(res) {
    const yaku = res.yaku.map(y => `<li><span>${y.name}</span><span>${y.han}翻</span></li>`).join('');
    const fu = res.han < 5
      ? `<p class="fu-line">${res.fuItems.map(([name, f]) => `${name} ${f}`).join('、')} → <b>${res.fu}符</b></p>`
      : '';
    return `<div class="breakdown"><ul>${yaku}</ul><p class="total-line">${res.han}翻 ${res.han < 5 ? res.fu + '符' : ''}</p>${fu}</div>`;
  }

  function check() {
    const inputs = [...document.querySelectorAll('#fields input')];
    const user = inputs.map(el => parseInt(el.value.replace(/[^0-9]/g, ''), 10));
    if (user.some(v => Number.isNaN(v))) {
      $('msg').textContent = '数字を入力してください。';
      return;
    }
    $('msg').textContent = '';
    answered = true;
    inputs.forEach(el => (el.disabled = true));

    const isHand = current.kind === 'hand';
    const res = isHand ? evaluateHand(current.hand, rule()) : null;
    const cat = isHand ? classifyHand(current, user, rule()) : classify(current, user, rule());
    const correct = isHand ? payments(res.base, current.dealer, current.tsumo) : answerOf(current, rule());
    const s = stats();
    s.total++;
    if (cat === null) {
      s.correct++;
      s.streak++;
      s.best = Math.max(s.best, s.streak);
    } else {
      s.streak = 0;
    }
    s.recent.push(cat);
    if (s.recent.length > RECENT_LIMIT) s.recent.shift();
    save();

    const n = x => x.toLocaleString('ja-JP');
    const labels = fieldsFor(current);
    const answerText = correct.map((v, i) => (correct.length > 1 ? `${labels[i]} ${n(v)}` : n(v))).join('、');
    $('result').innerHTML = (cat === null
      ? `<div class="verdict ok">正解！</div>`
      : `<div class="verdict ng">不正解<span class="tag">${categories()[cat].label}</span></div>
         <p>正解は <b>${answerText}</b></p>`) + (isHand ? handBreakdown(res) : '');
    $('result').hidden = false;
    $('mainBtn').textContent = '次の問題';
    $('mainBtn').focus();
    renderStats();
  }

  function renderStats() {
    const s = stats();
    $('statsTitle').textContent = isHandTab() ? '成績（牌姿から）' : '成績（翻・符から）';
    $('rate').textContent = s.total ? `${Math.round(s.correct / s.total * 100)}%` : '-';
    $('streak').textContent = s.streak;
    $('best').textContent = s.best;
    $('recentNote').textContent = `直近${s.recent.length}問（最大${RECENT_LIMIT}問）`;
    const cats = categories();
    const entries = Object.entries(catCounts(s)).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]);
    if (!entries.length) {
      $('bars').innerHTML = '<p class="empty">まだ間違いの記録はありません。</p>';
      return;
    }
    const max = entries[0][1];
    $('bars').innerHTML = entries.map(([k, v]) =>
      `<div class="bar-row"><span>${cats[k].label}</span><div class="bar"><span style="width:${v / max * 100}%"></span></div><span>${v}</span></div>`
    ).join('');
  }

  // 出題の種類（タブ・モード）を切り替える。答えていない問題は取っておき、戻したときに同じ問題を出す
  function switchTo(change) {
    const before = pendingKey();
    if (!answered) pending[before] = current;
    change();
    save();
    const key = pendingKey();
    const saved = pending[key];
    pending[key] = null;
    saved ? showQuestion(saved) : newQuestion();
    renderStats();
  }

  $('form').addEventListener('submit', e => {
    e.preventDefault();
    answered ? newQuestion() : check();
  });
  document.querySelectorAll('#tabs button').forEach(b => b.addEventListener('click', () => {
    if (b.dataset.tab === state.tab) return;  // 選択中のタブを押しても問題は変えない
    switchTo(() => { state.tab = b.dataset.tab; });
  }));
  document.querySelectorAll('#modeSeg button').forEach(b => b.addEventListener('click', () => {
    if (b.dataset.mode === state.mode) return;  // 選択中のモードを押しても問題は変えない
    switchTo(() => { state.mode = b.dataset.mode; });
  }));
  $('kiriage').addEventListener('change', e => {
    // 出題中の問題はそのままにして、ルールだけ切り替える（答え合わせは新しいルールで行う）
    state.kiriage = e.target.checked; save(); renderControls();
  });
  $('reset').addEventListener('click', () => {
    const name = isHandTab() ? '牌姿から' : '翻・符から';
    if (!confirm(`「${name}」の成績と苦手の記録をリセットしますか？`)) return;
    if (isHandTab()) state.hand = freshStats();
    else Object.assign(state, freshStats());
    save();
    renderStats();
  });

  renderStats();
  newQuestion();
}
</script>
</body>
</html>
